[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "norefund"
version = "0.1.0"
description = "Know before you run. Token counter and cost estimator for LLMs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Vikramaditya Khupse" }
]
keywords = ["llm", "tokens", "cost", "ai", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "customtkinter>=5.2.2",
    "tiktoken>=0.7.0",
    "pypdf>=4.3.1",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "pyyaml>=6.0.2",
    "tokenizers>=0.23.1",
    "platformdirs>=4.0",
    "huggingface_hub>=0.25.0",
    "keyring>=25.0",
    "Pillow>=10.0",
    "reportlab>=4.0",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.19",
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pyinstaller>=6.21.0",
]
dnd = [
    "tkinterdnd2>=0.4.2",
]
linux = [
    "pygobject>=3.50",
]
macos = [
    # py2app 0.28.9+ hard-fails with "install_requires is no longer
    # supported" the moment ANY pyproject.toml with a [project.dependencies]
    # table exists anywhere setuptools' own auto-discovery can find one --
    # this project's own, not anything macos_setup.py passes to setup().
    # Upstream bug, open as of this pin:
    # https://github.com/ronaldoussoren/py2app/issues/560
    "py2app>=0.28,<0.28.9",
]

[project.scripts]
norefund = "norefund.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/norefund"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]
