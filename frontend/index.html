<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      script-src needs 'unsafe-eval': WebKitGTK's evaluate_javascript (how
      pywebview injects window.pywebview.api) is itself subject to the
      page's CSP, and without this the whole bridge fails at startup with
      "Refused to evaluate a string as JavaScript" before any app code runs.
      Everything else stays locked to 'self' — this does not open the page
      to remote script injection, only to pywebview's own host-side calls.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>NoRefund</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
