name: Release builds

# Builds Linux and Windows distributables and attaches them to a GitHub
# Release whenever a version tag (v1.2.3) is pushed. Can also be run by hand
# from the Actions tab to sanity-check the build without cutting a release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the build artifacts (no leading v). Test runs only, no release is created."
        required: false
        default: "0.0.0-dev"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check pyproject.toml matches the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$PYPROJECT_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::Tag is v${{ steps.resolve.outputs.version }} but pyproject.toml says $PYPROJECT_VERSION. Bump pyproject.toml's version and commit that before tagging a release."
            exit 1
          fi

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .[dev]

      - name: Build with PyInstaller
        run: pyinstaller packaging/norefund.spec --distpath dist --workpath build --noconfirm

      - name: Smoke test the binary actually launches
        run: |
          # There's no --version flag; with no args the app opens the GUI
          # and blocks in mainloop(), so give it 5s under a virtual display
          # and kill it. A clean launch exits 124 (timeout killed it); any
          # other code means it crashed on startup (this is exactly how the
          # PIL._tkinter_finder packaging bug was first caught).
          sudo apt-get update -y && sudo apt-get install -y xvfb
          set +e
          xvfb-run --auto-servernum timeout 5 ./dist/NoRefund/NoRefund
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "::error::NoRefund exited with code $code within 5s instead of staying up — the frozen build is broken."
            exit 1
          fi

      - name: Package tarball
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          tar -czf "NoRefund-${VERSION}-linux-x86_64.tar.gz" -C dist NoRefund

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: NoRefund-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .[dev]

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build with PyInstaller
        run: pyinstaller packaging\norefund.spec --distpath dist --workpath build --noconfirm

      - name: Smoke test the binary actually launches
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\NoRefund\NoRefund.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "NoRefund.exe exited within 5s (exit code $($proc.ExitCode)) instead of staying up — the frozen build is broken."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          iscc "/DMyAppVersion=$version" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: packaging/windows/dist/NoRefund-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [version, build-linux, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/linux-build/* \
            artifacts/windows-build/* \
            --title "NoRefund ${{ github.ref_name }}" \
            --generate-notes
