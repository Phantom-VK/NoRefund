- id: deepseek:deepseek-v4-flash
  display_name: "DeepSeek V4 Flash"
  provider: "DeepSeek"
  tokenizer_backend: "hf"
  tokenizer_name: "deepseek-ai/DeepSeek-V4-Flash"
  context_window: 1048576  # config.json's max_position_embeddings
  # Storing the peak / cache-miss rate: this app's one-off document
  # analyses never hit a warm cache, and peak is the provider's own
  # "assume the worst case" hours. Off-peak (all hours except
  # 01:00-04:00 and 06:00-10:00 UTC Mon-Fri -- these ARE peak, not
  # off-peak; the source doc that preceded this file had that backwards)
  # halves both rates to $0.22/$0.66.
  input_price_per_million: 0.44
  output_price_per_million: 1.32
  currency: "USD"
  docs_url: "https://api-docs.deepseek.com/quick_start/pricing"
  pricing_note: "Off-peak (all hours except 01:00-04:00 and 06:00-10:00 UTC Mon-Fri) halves both rates to $0.22/$0.66."
  pricing_verified_on: "2026-08-26"

- id: deepseek:deepseek-v3
  display_name: "DeepSeek V3 (self-hosted)"
  provider: "DeepSeek"
  tokenizer_backend: "hf"
  # Separate from deepseek:deepseek-v4-flash above -- V3 is superseded as
  # a hosted API product (delisted from DeepSeek's own pricing page) but
  # remains a real, self-hostable open-weight model with its own
  # model_architectures.yaml entry (MLA parameters, kv_lora_rank=512),
  # which needs a matching entry here or the Fit Check has nothing to
  # look up. Zero-priced since nobody pays DeepSeek per-token to run
  # their own weights.
  tokenizer_name: "deepseek-ai/DeepSeek-V3"
  context_window: 163840  # matches model_architectures.yaml's max_context_length
  input_price_per_million: 0.00
  output_price_per_million: 0.00
  currency: "USD"
  docs_url: "https://huggingface.co/deepseek-ai/DeepSeek-V3"

