# Architecture parameters for self-hostable open-weight models, used by the
# self-host VRAM fit calculator (core/selfhost.py).
#
# Every number here is copied from the model's published HuggingFace
# config.json (linked via docs_url), not derived or guessed. In particular:
#
# - head_dim is NOT always hidden_size / n_attention_heads. Gemma 2 9B is the
#   counter-example: hidden_size=3584, n_attention_heads=16 gives 224, but
#   its real head_dim is 256. Always copy head_dim from config.json.
# - n_kv_heads is the GQA key/value head count, which is smaller than
#   n_attention_heads for every model here. Using n_attention_heads instead
#   would overstate KV-cache memory (8x for Llama 3.1 70B).
# - total_params/active_params differ only for mixture-of-experts models
#   (Mixtral, DeepSeek V3). See core/selfhost.py for why weight memory uses
#   total_params, not active_params.

