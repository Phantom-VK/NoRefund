# Hardware targets for the self-host VRAM fit calculator (core/selfhost.py).
#
# memory_gib_per_device is GiB (2**30 bytes), matching what nvidia-smi and
# Apple's System Report actually report -- an "80GB" A100 is 81920 MiB, not
# 80,000,000,000 bytes. Using GB here would silently under-count by ~7%.
#
# usable_memory_fraction is the share of nameplate memory a serving process
# can actually allocate, after the driver/display reserve and allocator
# fragmentation. 0.90 for discrete NVIDIA matches vLLM's gpu_memory_utilization
# default. Apple unified memory is capped by macOS's Metal
# recommendedMaxWorkingSetSize (~75% of RAM) since the GPU shares memory with
# the whole OS, not a dedicated pool.

# --- datacenter_gpu (7) ---

- id: nvidia:a100-40gb
  display_name: "NVIDIA A100 40GB"
  category: "datacenter_gpu"
  vendor: "NVIDIA"
  accelerator: "NVIDIA A100"
  device_count: 1
  memory_gib_per_device: 40.0
  memory_kind: "discrete"
  usable_memory_fraction: 0.90

